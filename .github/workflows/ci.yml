name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # The workspace layout the .csproj files expect: three siblings, as in /home/jve/bak.
      #   DotNetProjects   this repo (the Spice86 overrides)
      #   Spice86          ..\..\Spice86\src\...   from BetrayalAtKrondor/
      #   bakagain         ..\..\bakagain\src\...  (GameData, ResourceExtraction; TASK-670)
      - name: Checkout ReverseBak
        uses: actions/checkout@v4
        with:
          path: DotNetProjects

      - name: Checkout the public monorepo (shared GameData / ResourceExtraction)
        uses: actions/checkout@v4
        with:
          repository: stellargames/bakagain
          path: bakagain

      # Spice86 is a build dependency (referenced via relative path, not NuGet).
      # If the Spice86 repo is private, set a CI_PAT secret with repo read access;
      # otherwise the default token only works for public repos.
      - name: Checkout Spice86 (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: JorisVanEijden/Spice86
          ref: master
          path: Spice86
          token: ${{ secrets.CI_PAT || github.token }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DotNetProjects/BetrayalAtKrondor.sln

      - name: Build
        run: dotnet build DotNetProjects/BetrayalAtKrondor.sln -c Release --no-restore

      # Only the override tests live here now; the shared projects' tests run in the monorepo's CI.
      - name: Test
        run: dotnet test DotNetProjects/BetrayalAtKrondor.sln -c Release --no-build --verbosity normal
